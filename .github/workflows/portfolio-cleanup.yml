name: Apply portfolio cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor portfolio files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root = Path('.')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          # Move the authoritative inline stylesheet into style.css.
          m = re.search(r'\n  <style>\n(?P<css>.*?)\n  </style>\n', html, re.S)
          if not m:
              raise SystemExit('Inline main stylesheet not found; aborting safely.')
          css = m.group('css').rstrip() + '\n'
          (root / 'style.css').write_text(
              '/* Main site stylesheet. Extracted from index.html to keep the HTML maintainable. */\n' + css,
              encoding='utf-8'
          )
          html = html[:m.start()] + '\n  <link rel="stylesheet" href="./style.css">\n' + html[m.end():]

          # Make stat suffixes explicit instead of hard-coding 97% and + in JS.
          html = html.replace('data-count="3">0</div><div class="stat-label">Technical Projects', 'data-count="3" data-suffix="+">0</div><div class="stat-label">Technical Projects')
          html = html.replace('data-count="6">0</div><div class="stat-label">Core Security Tools', 'data-count="6" data-suffix="+">0</div><div class="stat-label">Core Security Tools')
          html = html.replace('data-count="97">0%</div><div class="stat-label">Highest Training Evaluation', 'data-count="97" data-suffix="%">0%</div><div class="stat-label">Highest Training Evaluation')
          html = html.replace(
              'const target=+el.dataset.count;let n=0;const step=Math.max(1,Math.ceil(target/35));',
              'const target=Number(el.dataset.count);const suffix=el.dataset.suffix||"";let n=0;const step=Math.max(1,Math.ceil(target/35));'
          )
          html = html.replace('el.textContent=n+(target===97?"%":"+");', 'el.textContent=n+suffix;')

          # Cap terminal DOM growth from the continuous visual log.
          html = html.replace(
              'out.appendChild(d);out.scrollTop=out.scrollHeight;li++;setTimeout(addLog,li%logs.length===0?2600:500+Math.random()*500)',
              'out.appendChild(d);while(out.children.length>24)out.removeChild(out.firstElementChild);out.scrollTop=out.scrollHeight;li++;setTimeout(addLog,li%logs.length===0?2600:500+Math.random()*500)'
          )

          # Token-based category matching and null-safe search.
          html = html.replace(
              'const q=search.value.toLowerCase().trim();cards.forEach(c=>{const okCat=active==="all"||c.dataset.category.includes(active);const okSearch=c.dataset.search.includes(q);',
              'const q=(search.value||"").toLowerCase().trim();cards.forEach(c=>{const categories=(c.dataset.category||"").toLowerCase().split(/\\s+/).filter(Boolean);const okCat=active==="all"||categories.includes(active);const okSearch=(c.dataset.search||"").toLowerCase().includes(q);'
          )

          # Remove the dead closeCert reference; certificate links are direct PDF links.
          html = html.replace('if(typeof closeCert==="function") closeCert()', '')

          # Add canonical/OG URL metadata.
          marker = '  <meta property="og:type" content="website">\n'
          if '<link rel="canonical"' not in html:
              html = html.replace(marker, marker + '  <link rel="canonical" href="https://abdelrhman-elmsawy.github.io/">\n  <meta property="og:url" content="https://abdelrhman-elmsawy.github.io/">\n')

          index.write_text(html, encoding='utf-8')

          # Improve the manifest with icons already present in the repository.
          manifest = root / 'site.webmanifest'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['icons'] = [
              {'src':'./favicon-16.png','sizes':'16x16','type':'image/png'},
              {'src':'./favicon-32.png','sizes':'32x32','type':'image/png'},
              {'src':'./favicon-48.png','sizes':'48x48','type':'image/png'},
              {'src':'./apple-touch-icon.png','sizes':'180x180','type':'image/png','purpose':'any maskable'}
          ]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          manifest=json.loads(Path('site.webmanifest').read_text(encoding='utf-8'))
          assert '<style>' not in html, 'Inline style block still present'
          assert './style.css' in html, 'style.css not linked'
          assert 'data-suffix="+"' in html and 'data-suffix="%"' in html, 'Counter suffixes not explicit'
          assert 'out.children.length>24' in html, 'Terminal cap missing'
          assert 'categories.includes(active)' in html, 'Category token matching missing'
          assert 'closeCert()' not in html, 'Dead certificate function reference remains'
          assert len(css) > 10000, 'Extracted stylesheet unexpectedly small'
          assert len(manifest.get('icons', [])) == 4, 'Manifest icons missing'
          print('Validation passed')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css site.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m 'Refactor portfolio CSS and harden interactions'
          git push
