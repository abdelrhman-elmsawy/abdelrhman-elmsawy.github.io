name: Add Security Research Scout to Work

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert case-study card and remove one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          marker = '<!-- SECURITY RESEARCH SCOUT -->'
          if marker not in text:
              card = '''<!-- SECURITY RESEARCH SCOUT -->
          <article class="project" data-category="security" data-search="security research cybersecurity research AI workflow source grounded research scout vulnerability assessment security analysis">

          <div class="project-media">
          <div class="media-code"><b>SECURITY RESEARCH</b>SOURCE / RELEVANCE / UNCERTAINTY<br>AI-ASSISTED WORKFLOW · CASE STUDY</div>
          </div>

          <span class="tag">Security Research</span>
          <h3>Security Research Scout</h3>
          <p>Designed a repeatable cybersecurity research workflow that turns recent relevant research into a short, source-grounded brief with explicit uncertainty and safe authorized next steps.</p>

          <div class="mini-grid chips"><span class="chip">Research</span><span class="chip">Source Checking</span><span class="chip">AI Workflow</span><span class="chip">Security</span></div>

          <div class="project-actions">
          <a class="details" href="security-research-scout.html">VIEW CASE STUDY →</a>
          </div>
          <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">SEP 2026</span><span class="mono" style="font-size:9px;color:var(--cyan)">RESEARCH WORKFLOW</span></div>

          </article>
          '''
              anchor = '<article class="project" data-category="security pentest"'
              if anchor not in text:
                  raise SystemExit('Expected projects anchor not found')
              text = text.replace(anchor, card + anchor, 1)
              index.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/add-security-research-scout.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-security-research-scout.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Security Research Scout case study"
          git push
