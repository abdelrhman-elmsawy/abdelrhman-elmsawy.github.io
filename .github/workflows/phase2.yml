name: Apply Phase 2 Portfolio Enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade projects and security lab
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''\n    /* PHASE 2 — PROJECTS + SECURITY LAB */\n    .project{cursor:pointer}\n    .project-media{background:radial-gradient(circle at 50% 35%,rgba(0,255,136,.08),transparent 58%),linear-gradient(135deg,rgba(0,255,136,.05),rgba(0,217,255,.035))}\n    .project:hover .project-media{border-color:rgba(0,255,136,.28);box-shadow:inset 0 0 35px rgba(0,255,136,.045)}\n    .project-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(0,255,136,.10)}\n    .project-meta span{font:9px "Share Tech Mono";color:var(--muted);letter-spacing:.7px}\n    .project-meta b{font-weight:400;color:var(--green)}\n    .project-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n    .project-tools span{font:8px "Share Tech Mono";padding:4px 6px;border:1px solid rgba(0,217,255,.16);border-radius:5px;color:var(--cyan);background:rgba(0,217,255,.025)}\n    .lab-console{position:relative}\n    .lab-console:before{content:"LIVE";position:absolute;right:12px;top:10px;font:8px "Share Tech Mono";letter-spacing:2px;color:var(--green);opacity:.7}\n    .lab-console div{transition:background .2s,padding-left .2s}\n    .lab-console div:hover{background:rgba(0,255,136,.035);padding-left:5px}\n    .lab-command{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}\n    .lab-command button{border:1px solid var(--line);background:rgba(0,255,136,.035);color:var(--green);border-radius:8px;padding:8px 10px;font:9px "Share Tech Mono";cursor:pointer;transition:.2s}\n    .lab-command button:hover{border-color:rgba(0,255,136,.35);transform:translateY(-2px)}\n    .lab-output{margin-top:12px;min-height:58px;padding:11px;border:1px solid rgba(0,255,136,.10);border-radius:9px;background:#020503;color:var(--muted);font:10px/1.7 "Share Tech Mono";white-space:pre-wrap}\n    .modal-project-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px;margin-top:20px}\n    .modal-evidence,.modal-side{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(0,255,136,.018)}\n    .modal-media{margin-top:9px;min-height:150px;display:grid;place-items:center;border:1px dashed rgba(0,255,136,.16);border-radius:9px;color:var(--muted);font:10px "Share Tech Mono";text-align:center;padding:15px}\n    .repo-pending{display:block;margin-top:12px;color:var(--muted);font:9px "Share Tech Mono"}\n    @media(max-width:680px){.modal-project-grid{grid-template-columns:1fr}.lab-command button{min-height:40px;flex:1 1 calc(50% - 5px)}}\n'''
          anchor='    /* MODAL */'
          if '/* PHASE 2 — PROJECTS + SECURITY LAB */' not in s:
              s=s.replace(anchor,css+'\n'+anchor,1)

          old='''            <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">JAN–FEB 2026</span><span class="mono" style="font-size:9px;color:var(--cyan)">LAB / SIMULATION</span></div>'''
          new='''            <div class="project-meta"><span>STACK</span><b>CISCO · ACL · NAT · DHCP</b></div>\n            <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">JAN–FEB 2026</span><span class="mono" style="font-size:9px;color:var(--cyan)">LAB / SIMULATION</span></div>'''
          s=s.replace(old,new,1)
          old='''            <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">AUG–SEP 2025</span><span class="mono" style="font-size:9px;color:var(--cyan)">PACKET TRACER</span></div>'''
          new='''            <div class="project-meta"><span>STACK</span><b>VLAN · OSPF · NAT/PAT · SSH</b></div>\n            <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">AUG–SEP 2025</span><span class="mono" style="font-size:9px;color:var(--cyan)">PACKET TRACER</span></div>'''
          s=s.replace(old,new,1)

          old='''            <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">LAB WORK</span><span class="mono" style="font-size:9px;color:var(--cyan)">CONTROLLED LAB</span></div>'''
          new='''            <div class="project-meta"><span>STACK</span><b>NMAP · WIRESHARK · BURP · KALI</b></div>\n            <div class="project-footer"><span class="mono" style="font-size:10px;color:var(--muted)">LAB WORK</span><span class="mono" style="font-size:9px;color:var(--cyan)">CONTROLLED LAB</span></div>'''
          s=s.replace(old,new,1)

          anchor='''          <div class="lab-console">\n            <div><span class="log-ok">[01]</span> Reconnaissance <b>READY</b></div>'''
          replacement='''          <div>\n            <div class="lab-console">\n              <div><span class="log-ok">[01]</span> Reconnaissance <b>READY</b></div>'''
          if anchor in s and 'id="labOutput"' not in s:
              s=s.replace(anchor,replacement,1)
              old='''            <div><span class="log-warn">[05]</span> Reporting & Remediation <b>READY</b></div>\n          </div>\n        </div>'''
              new='''              <div><span class="log-warn">[05]</span> Reporting & Remediation <b>READY</b></div>\n            </div>\n            <div class="lab-command" aria-label="Security lab command shortcuts">\n              <button data-lab-cmd="recon">$ recon</button><button data-lab-cmd="enum">$ enum</button><button data-lab-cmd="scan">$ vuln-scan</button><button data-lab-cmd="report">$ report</button>\n            </div>\n            <div class="lab-output" id="labOutput">$ lab --status\nControlled environment ready. Choose a workflow command.</div>\n          </div>\n        </div>'''
              s=s.replace(old,new,1)

          js='''\n    // Phase 2 — interactive controlled lab console\n    const labOutput=document.getElementById("labOutput");\n    const labMessages={\n      recon:"$ recon\\n[ok] Authorized lab scope loaded\\n[ok] Host discovery workflow ready\\n[next] Enumerate exposed services before assessment.",\n      enum:"$ enum\\n[ok] Service enumeration workflow ready\\n[info] Collect ports, versions and banners\\n[next] Correlate findings with known weaknesses.",\n      scan:"$ vuln-scan\\n[ok] Assessment workflow initialized\\n[info] Review evidence, severity and affected assets\\n[next] Validate findings manually in the lab.",\n      report:"$ report\\n[ok] Reporting template ready\\n[info] Finding → evidence → impact → remediation\\n[next] Keep conclusions tied to observed evidence."\n    };\n    document.querySelectorAll("[data-lab-cmd]").forEach(btn=>btn.onclick=()=>{labOutput.textContent=labMessages[btn.dataset.labCmd]||"$ lab --help\\nNo command selected."});\n'''
          anchor='''    // Project filters/search'''
          if 'interactive controlled lab console' not in s:
              s=s.replace(anchor,js+'\n'+anchor,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/phase2.yml
          git add index.html .github/workflows/phase2.yml
          git commit -m "Upgrade projects and interactive security lab"
          git push
